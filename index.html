<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VoxPlay Auto</title>
  <!-- HLS.js para IPTV -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-main: #0a0d12;
      --bg-surface: #141922;
      --bg-surface-elevated: #1e2533;
      --accent-radio: #00d2ff;
      --accent-radio-glow: rgba(0, 210, 255, 0.4);
      --accent-tv: #ff385c;
      --accent-tv-glow: rgba(255, 56, 92, 0.4);
      --text-primary: #ffffff;
      --text-secondary: #8c96a8;
      --border-color: rgba(255, 255, 255, 0.1);
      --card-radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ENCABEZADO */
    header {
      background: var(--bg-surface);
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 2px solid var(--border-color);
      flex-shrink: 0;
      gap: 16px;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--accent-radio), #0066ff);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 20px;
      color: #0a0d12;
    }

    .brand-title {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .brand-title span {
      color: var(--accent-radio);
    }

    /* BOTONES PRINCIPALES SEPARADOS */
    .nav-tabs {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .tab-btn {
      width: 160px;
      height: 56px;
      border-radius: 12px;
      border: 2px solid var(--border-color);
      background: var(--bg-surface-elevated);
      color: var(--text-secondary);
      font-size: 17px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
      transition: all 0.15s ease;
    }

    .tab-btn svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .tab-btn:active {
      transform: scale(0.95);
    }

    .tab-btn#tab-radio.active {
      color: #ffffff;
      background: #112638;
      border-color: var(--accent-radio);
      box-shadow: 0 0 16px var(--accent-radio-glow);
    }
    .tab-btn#tab-radio.active svg {
      fill: var(--accent-radio);
    }

    .tab-btn#tab-tv.active {
      color: #ffffff;
      background: #33151c;
      border-color: var(--accent-tv);
      box-shadow: 0 0 16px var(--accent-tv-glow);
    }
    .tab-btn#tab-tv.active svg {
      fill: var(--accent-tv);
    }

    .search-box {
      display: flex;
      align-items: center;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 0 12px;
      height: 46px;
      width: 210px;
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 15px;
      width: 100%;
    }

    /* CONTENEDOR PRINCIPAL */
    main {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #scrollArea {
      height: 100%;
      overflow-y: auto;
      padding: 14px 16px;
      -webkit-overflow-scrolling: touch;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    /* TARJETAS MÁS PEQUEÑAS Y COMPACTAS */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
      gap: 12px;
      padding-bottom: 96px;
    }

    .card {
      position: relative;
      background: var(--bg-surface);
      border: 1.5px solid var(--border-color);
      border-radius: var(--card-radius);
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      min-height: 130px;
      justify-content: space-between;
      transition: all 0.15s ease;
    }

    .card:active {
      transform: scale(0.95);
      background: var(--bg-surface-elevated);
    }

    .card.is-playing {
      border-color: var(--accent-radio);
      background: linear-gradient(180deg, rgba(0, 210, 255, 0.15) 0%, var(--bg-surface) 100%);
      box-shadow: 0 0 14px var(--accent-radio-glow);
    }

    .card-img-wrapper {
      position: relative;
      width: 58px;
      height: 58px;
      border-radius: 10px;
      background: #0d1117;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .card-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 4px;
    }

    .card-img-wrapper .placeholder-icon {
      font-size: 26px;
      color: var(--text-secondary);
    }

    .card-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 4px;
    }

    .card-tag {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 7px;
      border-radius: 5px;
    }

    /* ECUALIZADOR COMPACTO EN TARJETA */
    .card-equalizer-badge {
      display: none;
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid var(--accent-radio);
      border-radius: 6px;
      padding: 3px 5px;
      align-items: flex-end;
      gap: 2.5px;
      height: 18px;
      z-index: 5;
    }

    .card.is-playing .card-equalizer-badge {
      display: flex;
    }

    .eq-bar {
      width: 2.5px;
      background: var(--accent-radio);
      border-radius: 2px;
      animation: eqBounce 0.8s ease-in-out infinite alternate;
    }

    .eq-bar:nth-child(1) { height: 40%; animation-delay: 0.1s; }
    .eq-bar:nth-child(2) { height: 100%; animation-delay: 0.35s; }
    .eq-bar:nth-child(3) { height: 65%; animation-delay: 0.2s; }
    .eq-bar:nth-child(4) { height: 85%; animation-delay: 0.45s; }

    @keyframes eqBounce {
      0% { height: 25%; }
      100% { height: 100%; }
    }

    /* VISTA DE CONDUCCIÓN CUANDO DESAPARECEN LAS TARJETAS */
    .driving-view {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 84px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      background: radial-gradient(circle at center, #152233 0%, var(--bg-main) 70%);
      z-index: 5;
    }

    .driving-view.active {
      display: flex;
    }

    .driving-logo-box {
      width: 96px;
      height: 96px;
      border-radius: 20px;
      background: #0d1117;
      border: 2px solid var(--accent-radio);
      box-shadow: 0 0 25px var(--accent-radio-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .driving-logo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 8px;
    }

    .driving-station-name {
      font-size: 26px;
      font-weight: 900;
      color: #fff;
      margin-bottom: 10px;
      max-width: 80%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .driving-eq {
      display: flex;
      align-items: flex-end;
      gap: 5px;
      height: 28px;
      margin-bottom: 6px;
    }

    .driving-eq .eq-bar {
      width: 5px;
      background: var(--accent-radio);
      border-radius: 3px;
    }

    /* BOTÓN FLOTANTE INFERIOR PEQUEÑO PARA MOSTRAR TARJETAS */
    .floating-cards-btn {
      position: fixed;
      bottom: 96px; /* Justo sobre la barra del reproductor */
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-surface-elevated);
      border: 1.5px solid var(--accent-radio);
      color: #ffffff;
      height: 42px;
      padding: 0 18px;
      border-radius: 21px;
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6), 0 0 10px var(--accent-radio-glow);
      z-index: 60;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .floating-cards-btn.visible {
      display: flex;
    }

    .floating-cards-btn:active {
      transform: translateX(-50%) scale(0.93);
      background: #112638;
    }

    .floating-cards-btn svg {
      width: 18px;
      height: 18px;
      fill: var(--accent-radio);
    }

    /* REPRODUCTOR INFERIOR */
    .radio-player-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 84px;
      background: var(--bg-surface-elevated);
      border-top: 2px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 50;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.6);
    }

    .player-track-info {
      display: flex;
      align-items: center;
      gap: 14px;
      max-width: 48%;
    }

    .player-logo-container {
      width: 54px;
      height: 54px;
      flex-shrink: 0;
    }

    .player-logo {
      width: 100%;
      height: 100%;
      border-radius: 10px;
      background: #0d1117;
      object-fit: contain;
      padding: 3px;
      border: 1px solid var(--border-color);
    }

    .player-texts {
      overflow: hidden;
    }

    .player-name {
      font-size: 17px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 3px;
    }

    .player-status {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-radio);
      text-transform: uppercase;
    }

    .bar-equalizer {
      display: none;
      align-items: flex-end;
      gap: 2.5px;
      height: 14px;
      width: 16px;
    }

    .bar-equalizer.active {
      display: flex;
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .ctrl-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      background: #283244;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .ctrl-btn:active {
      transform: scale(0.92);
    }

    .ctrl-btn.play-btn {
      background: var(--accent-radio);
      color: #0a0d12;
      width: 62px;
      height: 62px;
      box-shadow: 0 0 14px var(--accent-radio-glow);
    }

    .ctrl-btn svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }

    /* MODAL DE TV */
    .tv-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #000;
      display: none;
      flex-direction: column;
      z-index: 100;
    }

    .tv-modal.active {
      display: flex;
    }

    .tv-header {
      height: 60px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 10;
    }

    .tv-title {
      font-size: 19px;
      font-weight: 800;
      color: #fff;
    }

    .tv-close-btn {
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
    }

    .tv-video-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      max-height: 100vh;
      object-fit: contain;
    }

    .status-msg {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      color: var(--text-secondary);
      font-size: 17px;
      gap: 14px;
    }
  </style>
</head>
<body>

  <!-- BARRA SUPERIOR -->
  <header>
    <div class="brand">
      <div class="brand-logo">V</div>
      <div class="brand-title">VoxPlay <span>Auto</span></div>
    </div>

    <div class="nav-tabs">
      <button class="tab-btn active" id="tab-radio" onclick="switchSection('radio')">
        <svg viewBox="0 0 24 24"><path d="M3.24 6.15C2.51 6.43 2 7.17 2 8v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-.83-.51-1.57-1.24-1.85L10.2 2.18c-.7-.27-1.48-.27-2.18 0L3.24 6.15zM4 9h16v11H4V9zm8 3c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
        RADIO
      </button>

      <button class="tab-btn" id="tab-tv" onclick="switchSection('tv')">
        <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
        TELEVISIÓN
      </button>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Buscar..." oninput="filterItems()">
    </div>
  </header>

  <!-- ÁREA DE CONTENIDO -->
  <main>
    <div id="scrollArea">
      <div class="status-msg" id="loadingMsg">Cargando emisoras...</div>
      <div class="grid" id="cardsGrid" style="display: none;"></div>
    </div>

    <!-- PANTALLA LIMPIA DE CONDUCCIÓN (SE ACTIVA TRAS 5 SEGUNDOS DE REPRODUCCIÓN) -->
    <div class="driving-view" id="drivingView">
      <div class="driving-logo-box">
        <img id="drivingLogo" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23666'><path d='M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z'/></svg>" alt="Station">
      </div>
      <div class="driving-station-name" id="drivingTitle">Emisora en Vivo</div>
      <div class="driving-eq">
        <span class="eq-bar"></span>
        <span class="eq-bar"></span>
        <span class="eq-bar"></span>
        <span class="eq-bar"></span>
        <span class="eq-bar"></span>
      </div>
    </div>
  </main>

  <!-- BOTÓN FLOTANTE INFERIOR PARA REACTIVAR LAS TARJETAS -->
  <button class="floating-cards-btn" id="restoreBtn" onclick="restoreCards()">
    <svg viewBox="0 0 24 24"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg>
    Ver emisoras
  </button>

  <!-- BARRA INFERIOR DEL REPRODUCTOR -->
  <footer class="radio-player-bar">
    <div class="player-track-info">
      <div class="player-logo-container">
        <img id="playerLogo" class="player-logo" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23666'><path d='M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z'/></svg>" alt="Logo">
      </div>
      <div class="player-texts">
        <div class="player-name" id="playerTitle">Seleccione una emisora</div>
        <div class="player-status-row">
          <div class="bar-equalizer" id="barEqualizer">
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
          </div>
          <span class="player-status" id="playerStatus">Listo</span>
        </div>
      </div>
    </div>

    <div class="player-controls">
      <button class="ctrl-btn" onclick="stopRadio()" title="Detener">
        <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
      </button>
      <button class="ctrl-btn play-btn" id="playPauseBtn" onclick="toggleRadioPlay()" title="Reproducir / Pausar">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pauseIcon" style="display:none;" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
    </div>
  </footer>

  <!-- REPRODUCTOR DE TV MODAL -->
  <div class="tv-modal" id="tvModal">
    <div class="tv-header">
      <div class="tv-title" id="tvChannelName">Canal de TV</div>
      <button class="tv-close-btn" onclick="closeTvModal()">✕ SALIR</button>
    </div>
    <div class="tv-video-container">
      <video id="tvVideo" controls autoplay playsinline></video>
    </div>
  </div>

  <audio id="radioAudio" preload="none"></audio>

  <script>
    const RADIO_URL = "https://raw.githubusercontent.com/sejo48/StreamTube-V20/refs/heads/main/radios.json";
    const TV_URL = "https://raw.githubusercontent.com/sejo48/StreamTube-V20/refs/heads/main/listaoficial.m3u";

    let currentSection = 'radio';
    let radioList = [];
    let tvList = [];
    let currentRadio = null;
    let isRadioPlaying = false;
    let hideTimer = null;
    let areCardsHidden = false;

    const audioPlayer = document.getElementById('radioAudio');
    const tvVideo = document.getElementById('tvVideo');
    let hlsInstance = null;

    window.addEventListener('DOMContentLoaded', () => {
      loadRadioData();
      loadTvData();

      // Eventos del reproductor
      audioPlayer.addEventListener('playing', () => {
        isRadioPlaying = true;
        updateRadioUI('EN VIVO');
        startAutoHideTimer();
      });

      audioPlayer.addEventListener('waiting', () => {
        updateRadioUI('SINTONIZANDO...');
      });

      audioPlayer.addEventListener('pause', () => {
        isRadioPlaying = false;
        clearTimeout(hideTimer);
        if (audioPlayer.currentTime > 0 && !audioPlayer.ended) {
          updateRadioUI('PAUSADO');
        }
      });

      audioPlayer.addEventListener('error', () => {
        isRadioPlaying = false;
        clearTimeout(hideTimer);
        restoreCards();
        updateRadioUI('ERROR DE TRANSMISIÓN');
      });

      // Si el usuario toca el área de tarjetas, posponer la ocultación
      document.getElementById('scrollArea').addEventListener('touchstart', resetTimerOnInteraction);
      document.getElementById('scrollArea').addEventListener('mousedown', resetTimerOnInteraction);
    });

    function resetTimerOnInteraction() {
      if (isRadioPlaying && !areCardsHidden) {
        startAutoHideTimer();
      }
    }

    // Inicia cuenta de 5 segundos para ocultar tarjetas
    function startAutoHideTimer() {
      clearTimeout(hideTimer);
      if (currentSection !== 'radio' || !isRadioPlaying) return;

      hideTimer = setTimeout(() => {
        if (isRadioPlaying && currentSection === 'radio') {
          hideCards();
        }
      }, 5000); // 5 segundos
    }

    function hideCards() {
      areCardsHidden = true;
      document.getElementById('scrollArea').style.display = 'none';
      document.getElementById('drivingView').classList.add('active');
      document.getElementById('restoreBtn').classList.add('visible');

      // Actualizar vista de conducción limpia
      if (currentRadio) {
        document.getElementById('drivingTitle').textContent = currentRadio.name;
        if (currentRadio.logo) {
          document.getElementById('drivingLogo').src = currentRadio.logo;
        }
      }
    }

    function restoreCards() {
      areCardsHidden = false;
      clearTimeout(hideTimer);
      document.getElementById('scrollArea').style.display = 'block';
      document.getElementById('drivingView').classList.remove('active');
      document.getElementById('restoreBtn').classList.remove('visible');

      // Reiniciar temporizador si continúa la música
      if (isRadioPlaying) {
        startAutoHideTimer();
      }
    }

    function switchSection(section) {
      currentSection = section;
      restoreCards();
      document.getElementById('searchInput').value = '';
      document.getElementById('tab-radio').classList.toggle('active', section === 'radio');
      document.getElementById('tab-tv').classList.toggle('active', section === 'tv');
      renderGrid();
    }

    async function loadRadioData() {
      try {
        const res = await fetch(RADIO_URL);
        const data = await res.json();
        const rawItems = Array.isArray(data) ? data : (data.radios || data.emisoras || data.stations || Object.values(data));
        
        radioList = rawItems.map(item => ({
          name: item.name || item.nombre || item.title || 'Emisora',
          url: item.url || item.stream || item.link || item.src,
          logo: item.logo || item.image || item.img || item.icon || '',
          category: item.genre || item.genero || item.pais || 'Radio'
        })).filter(item => item.url);

        if (currentSection === 'radio') renderGrid();
      } catch (err) {
        console.error('Error radios:', err);
      }
    }

    async function loadTvData() {
      try {
        const res = await fetch(TV_URL);
        const text = await res.text();
        tvList = parseM3U(text);
        if (currentSection === 'tv') renderGrid();
      } catch (err) {
        console.error('Error TV:', err);
      }
    }

    function parseM3U(m3uText) {
      const lines = m3uText.split(/\r?\n/);
      const items = [];
      let currentInfo = null;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;

        if (line.startsWith('#EXTINF:')) {
          const logoMatch = line.match(/tvg-logo="([^"]*)"/i) || line.match(/logo="([^"]*)"/i);
          const groupMatch = line.match(/group-title="([^"]*)"/i);
          const nameMatch = line.split(',')[1] || 'Canal';

          currentInfo = {
            name: nameMatch.trim(),
            logo: logoMatch ? logoMatch[1] : '',
            category: groupMatch ? groupMatch[1].trim() : 'TV'
          };
        } else if (!line.startsWith('#') && currentInfo) {
          currentInfo.url = line;
          items.push(currentInfo);
          currentInfo = null;
        }
      }
      return items;
    }

    function renderGrid() {
      const grid = document.getElementById('cardsGrid');
      const loading = document.getElementById('loadingMsg');
      const filter = document.getElementById('searchInput').value.toLowerCase().trim();
      const list = currentSection === 'radio' ? radioList : tvList;

      if (!list || list.length === 0) {
        loading.style.display = 'flex';
        loading.innerHTML = `Cargando ${currentSection === 'radio' ? 'emisoras' : 'canales'}...`;
        grid.style.display = 'none';
        return;
      }

      loading.style.display = 'none';
      grid.style.display = 'grid';
      grid.innerHTML = '';

      const filtered = list.filter(item => 
        item.name.toLowerCase().includes(filter) || 
        (item.category && item.category.toLowerCase().includes(filter))
      );

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="status-msg" style="grid-column: 1/-1;">Sin resultados para "${filter}".</div>`;
        return;
      }

      filtered.forEach((item) => {
        const isCurrentRadioPlaying = (currentSection === 'radio' && currentRadio && currentRadio.url === item.url && isRadioPlaying);
        
        const card = document.createElement('div');
        card.className = `card ${isCurrentRadioPlaying ? 'is-playing' : ''}`;
        
        const fallbackIcon = currentSection === 'radio' ? '📻' : '📺';
        const imgHtml = item.logo 
          ? `<img src="${item.logo}" alt="${item.name}" onerror="this.onerror=null; this.parentElement.innerHTML='<span class=\\'placeholder-icon\\'>${fallbackIcon}</span>'">`
          : `<span class="placeholder-icon">${fallbackIcon}</span>`;

        card.innerHTML = `
          <div class="card-equalizer-badge">
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
          </div>
          <div class="card-img-wrapper">${imgHtml}</div>
          <div class="card-title">${item.name}</div>
          <div class="card-tag">${item.category || currentSection.toUpperCase()}</div>
        `;

        card.onclick = () => {
          if (currentSection === 'radio') {
            playRadio(item);
          } else {
            playTv(item);
          }
        };

        grid.appendChild(card);
      });
    }

    function filterItems() {
      renderGrid();
    }

    function playRadio(item) {
      currentRadio = item;
      document.getElementById('playerTitle').textContent = item.name;
      if (item.logo) document.getElementById('playerLogo').src = item.logo;
      updateRadioUI('CONECTANDO...');

      audioPlayer.src = item.url;
      audioPlayer.play().catch(err => {
        console.error('Error al reproducir audio:', err);
        updateRadioUI('ERROR AL CONECTAR');
      });

      renderGrid();
      startAutoHideTimer();
    }

    function toggleRadioPlay() {
      if (!audioPlayer.src) return;
      if (audioPlayer.paused) {
        audioPlayer.play();
      } else {
        audioPlayer.pause();
      }
    }

    function stopRadio() {
      clearTimeout(hideTimer);
      audioPlayer.pause();
      audioPlayer.src = '';
      currentRadio = null;
      isRadioPlaying = false;
      document.getElementById('playerTitle').textContent = 'Seleccione una emisora';
      restoreCards();
      updateRadioUI('DETENIDO');
      renderGrid();
    }

    function updateRadioUI(statusText) {
      document.getElementById('playerStatus').textContent = statusText;
      document.getElementById('playIcon').style.display = isRadioPlaying ? 'none' : 'block';
      document.getElementById('pauseIcon').style.display = isRadioPlaying ? 'block' : 'none';
      document.getElementById('barEqualizer').classList.toggle('active', isRadioPlaying);
      renderGrid();
    }

    function playTv(item) {
      clearTimeout(hideTimer);
      if (!audioPlayer.paused) {
        audioPlayer.pause();
        isRadioPlaying = false;
        updateRadioUI('PAUSADO');
      }

      const modal = document.getElementById('tvModal');
      document.getElementById('tvChannelName').textContent = item.name;
      modal.classList.add('active');

      if (Hls.isSupported() && item.url.includes('.m3u8')) {
        if (hlsInstance) hlsInstance.destroy();
        hlsInstance = new Hls();
        hlsInstance.loadSource(item.url);
        hlsInstance.attachMedia(tvVideo);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => tvVideo.play());
      } else {
        tvVideo.src = item.url;
        tvVideo.play();
      }
    }

    function closeTvModal() {
      const modal = document.getElementById('tvModal');
      modal.classList.remove('active');
      tvVideo.pause();
      tvVideo.src = '';
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
    }
  </script>
</body>
</html>
