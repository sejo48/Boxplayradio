<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Box Play Radio</title>
  <!-- HLS.js para reproducción de video IPTV en vivo -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-main: #0a0d12;
      --bg-surface: #141922;
      --bg-surface-elevated: #1e2533;
      --accent-radio: #00d2ff;
      --accent-radio-glow: rgba(0, 210, 255, 0.4);
      --accent-tv: #ff385c;
      --accent-tv-glow: rgba(255, 56, 92, 0.4);
      --accent-fav: #ffc107;
      --accent-fav-glow: rgba(255, 193, 7, 0.5);
      --text-primary: #ffffff;
      --text-secondary: #8c96a8;
      --border-color: rgba(255, 255, 255, 0.1);
      --card-radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ENCABEZADO */
    header {
      background: var(--bg-surface);
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 2px solid var(--border-color);
      flex-shrink: 0;
      gap: 16px;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--accent-radio), #0066ff);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 20px;
      color: #0a0d12;
    }

    .brand-title {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .brand-title span {
      color: var(--accent-radio);
    }

    /* BOTONES PRINCIPALES SEPARADOS */
    .nav-tabs {
      display: flex;
      align-items: center;
      gap: 26px;
    }

    .tab-btn {
      width: 160px;
      height: 56px;
      border-radius: 12px;
      border: 2px solid var(--border-color);
      background: var(--bg-surface-elevated);
      color: var(--text-secondary);
      font-size: 17px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
      transition: all 0.15s ease;
    }

    .tab-btn svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .tab-btn:active {
      transform: scale(0.95);
    }

    .tab-btn#tab-radio.active {
      color: #ffffff;
      background: #112638;
      border-color: var(--accent-radio);
      box-shadow: 0 0 16px var(--accent-radio-glow);
    }
    .tab-btn#tab-radio.active svg {
      fill: var(--accent-radio);
    }

    .tab-btn#tab-tv.active {
      color: #ffffff;
      background: #33151c;
      border-color: var(--accent-tv);
      box-shadow: 0 0 16px var(--accent-tv-glow);
    }
    .tab-btn#tab-tv.active svg {
      fill: var(--accent-tv);
    }

    /* BOTÓN FAVORITOS EN CABECERA */
    .fav-filter-btn {
      height: 46px;
      padding: 0 14px;
      border-radius: 10px;
      background: var(--bg-surface-elevated);
      border: 1.5px solid var(--border-color);
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .fav-filter-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .fav-filter-btn.active {
      color: var(--accent-fav);
      border-color: var(--accent-fav);
      box-shadow: 0 0 12px var(--accent-fav-glow);
      background: #2a2410;
    }

    .fav-filter-btn:active {
      transform: scale(0.95);
    }

    .fav-filter-btn.hidden {
      display: none;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 0 12px;
      height: 46px;
      width: 190px;
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 15px;
      width: 100%;
    }

    /* CONTENEDOR PRINCIPAL */
    main {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #scrollArea {
      height: 100%;
      overflow-y: auto;
      padding: 14px 16px;
      -webkit-overflow-scrolling: touch;
    }

    /* CUADRÍCULA DE TARJETAS */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
      gap: 12px;
      padding-bottom: 96px;
    }

    body.tv-mode .grid {
      padding-bottom: 24px;
    }

    .card {
      position: relative;
      background: var(--bg-surface);
      border: 1.5px solid var(--border-color);
      border-radius: var(--card-radius);
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      min-height: 130px;
      justify-content: space-between;
      transition: all 0.15s ease;
    }

    .card:active {
      transform: scale(0.95);
      background: var(--bg-surface-elevated);
    }

    .card.is-playing {
      border-color: var(--accent-radio);
      background: linear-gradient(180deg, rgba(0, 210, 255, 0.15) 0%, var(--bg-surface) 100%);
      box-shadow: 0 0 14px var(--accent-radio-glow);
    }

    .card.is-favorite {
      border-color: var(--accent-fav);
    }

    /* BOTÓN ESTRELLA DE FAVORITO */
    .card-fav-btn {
      position: absolute;
      top: 6px;
      left: 6px;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 6;
      transition: all 0.15s ease;
    }

    .card-fav-btn svg {
      width: 16px;
      height: 16px;
      fill: var(--text-secondary);
      transition: fill 0.15s ease;
    }

    .card-fav-btn:active {
      transform: scale(0.85);
    }

    .card-fav-btn.is-fav {
      background: rgba(255, 193, 7, 0.18);
      border-color: var(--accent-fav);
    }

    .card-fav-btn.is-fav svg {
      fill: var(--accent-fav);
    }

    .card-img-wrapper {
      position: relative;
      width: 58px;
      height: 58px;
      border-radius: 10px;
      background: #0d1117;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .card-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 4px;
    }

    .card-img-wrapper .placeholder-icon {
      font-size: 26px;
      color: var(--text-secondary);
    }

    .card-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 4px;
    }

    .card-tag {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 7px;
      border-radius: 5px;
    }

    .card-equalizer-badge {
      display: none;
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid var(--accent-radio);
      border-radius: 6px;
      padding: 3px 5px;
      align-items: flex-end;
      gap: 2.5px;
      height: 18px;
      z-index: 5;
    }

    .card.is-playing .card-equalizer-badge {
      display: flex;
    }

    .eq-bar {
      width: 2.5px;
      background: var(--accent-radio);
      border-radius: 2px;
      animation: eqBounce 0.8s ease-in-out infinite alternate;
    }

    .eq-bar:nth-child(1) { height: 40%; animation-delay: 0.1s; }
    .eq-bar:nth-child(2) { height: 100%; animation-delay: 0.35s; }
    .eq-bar:nth-child(3) { height: 65%; animation-delay: 0.2s; }
    .eq-bar:nth-child(4) { height: 85%; animation-delay: 0.45s; }

    @keyframes eqBounce {
      0% { height: 25%; }
      100% { height: 100%; }
    }

    /* PANTALLA LIMPIA DE CONDUCCIÓN */
    .driving-view {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      background: radial-gradient(circle at center, #152233 0%, var(--bg-main) 75%);
      z-index: 10;
    }

    .driving-view.active {
      display: flex;
    }

    .driving-logo-box {
      width: 100px;
      height: 100px;
      border-radius: 20px;
      background: #0d1117;
      border: 2px solid var(--accent-radio);
      box-shadow: 0 0 25px var(--accent-radio-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .driving-logo-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 8px;
    }

    .driving-station-name {
      font-size: 26px;
      font-weight: 900;
      color: #fff;
      margin-bottom: 12px;
      max-width: 80%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .driving-eq {
      display: flex;
      align-items: flex-end;
      gap: 5px;
      height: 30px;
      margin-bottom: 12px;
    }

    .driving-eq .eq-bar {
      width: 5px;
      background: var(--accent-radio);
      border-radius: 3px;
    }

    /* BOTÓN FLOTANTE INFERIOR */
    .floating-cards-btn {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-surface-elevated);
      border: 1.5px solid var(--accent-radio);
      color: #ffffff;
      height: 44px;
      padding: 0 22px;
      border-radius: 22px;
      display: none;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.7), 0 0 12px var(--accent-radio-glow);
      z-index: 60;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .floating-cards-btn.visible {
      display: flex;
    }

    .floating-cards-btn:active {
      transform: translateX(-50%) scale(0.93);
      background: #112638;
    }

    .floating-cards-btn svg {
      width: 18px;
      height: 18px;
      fill: var(--accent-radio);
    }

    /* BARRA INFERIOR DE RADIO */
    .radio-player-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 84px;
      background: var(--bg-surface-elevated);
      border-top: 2px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 50;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.6);
    }

    .player-track-info {
      display: flex;
      align-items: center;
      gap: 14px;
      max-width: 48%;
    }

    .player-logo-container {
      width: 54px;
      height: 54px;
      flex-shrink: 0;
    }

    .player-logo {
      width: 100%;
      height: 100%;
      border-radius: 10px;
      background: #0d1117;
      object-fit: contain;
      padding: 3px;
      border: 1px solid var(--border-color);
    }

    .player-texts {
      overflow: hidden;
    }

    .player-name {
      font-size: 17px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 3px;
    }

    .player-status {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-radio);
      text-transform: uppercase;
    }

    .bar-equalizer {
      display: none;
      align-items: flex-end;
      gap: 2.5px;
      height: 14px;
      width: 16px;
    }

    .bar-equalizer.active {
      display: flex;
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    /* BOTÓN FAVORITO EN BARRA DE REPRODUCCIÓN */
    .player-fav-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: #283244;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .player-fav-btn svg {
      width: 24px;
      height: 24px;
      fill: var(--text-secondary);
    }

    .player-fav-btn.is-fav {
      background: #2a2410;
      box-shadow: 0 0 12px var(--accent-fav-glow);
    }

    .player-fav-btn.is-fav svg {
      fill: var(--accent-fav);
    }

    .player-fav-btn:active {
      transform: scale(0.92);
    }

    .ctrl-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      background: #283244;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .ctrl-btn:active {
      transform: scale(0.92);
    }

    .ctrl-btn.play-btn {
      background: var(--accent-radio);
      color: #0a0d12;
      width: 62px;
      height: 62px;
      box-shadow: 0 0 14px var(--accent-radio-glow);
    }

    .ctrl-btn svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }

    /* REPRODUCTOR MODAL DE TELEVISIÓN */
    .tv-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #000;
      display: none;
      flex-direction: column;
      z-index: 100;
    }

    .tv-modal.active {
      display: flex;
    }

    .tv-header {
      height: 60px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 10;
    }

    .tv-title {
      font-size: 19px;
      font-weight: 800;
      color: #fff;
    }

    .tv-close-btn {
      background: rgba(255, 255, 255, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
    }

    .tv-video-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      max-height: 100vh;
      object-fit: contain;
    }

    /* MENSAJES Y OPCIONES DE CARGA */
    .status-msg {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      color: var(--text-secondary);
      font-size: 16px;
      gap: 16px;
      text-align: center;
    }

    .btn-action {
      padding: 12px 24px;
      background: var(--accent-radio);
      border: none;
      color: #0a0d12;
      font-weight: 800;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
    }

    .btn-tv-action {
      background: var(--accent-tv);
      color: #ffffff;
    }

    .btn-secondary {
      background: var(--bg-surface-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
    }

    /* RESPONSIVE: OCULTAR FAV EN PANTALLAS MUY PEQUEÑAS */
    @media (max-width: 900px) {
      .brand-title { display: none; }
      .search-box { width: 130px; }
      .fav-filter-btn span { display: none; }
      .fav-filter-btn { padding: 0 12px; }
    }
  </style>
</head>
<body>

  <!-- ENCABEZADO -->
  <header>
    <div class="brand">
      <div class="brand-logo">B</div>
      <div class="brand-title">Box Play <span>Radio</span></div>
    </div>

    <!-- NAVEGACIÓN PRINCIPAL -->
    <div class="nav-tabs">
      <button class="tab-btn active" id="tab-radio" onclick="switchSection('radio')">
        <svg viewBox="0 0 24 24"><path d="M3.24 6.15C2.51 6.43 2 7.17 2 8v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-.83-.51-1.57-1.24-1.85L10.2 2.18c-.7-.27-1.48-.27-2.18 0L3.24 6.15zM4 9h16v11H4V9zm8 3c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
        RADIO
      </button>

      <button class="tab-btn" id="tab-tv" onclick="switchSection('tv')">
        <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
        TELEVISIÓN
      </button>
    </div>

    <!-- FILTRO DE FAVORITOS (solo visible en radio) -->
    <button class="fav-filter-btn" id="favFilterBtn" onclick="toggleFavFilter()" title="Mostrar solo favoritos">
      <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
      <span>Favoritos</span>
    </button>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Buscar..." oninput="filterItems()">
    </div>
  </header>

  <!-- CONTENIDO -->
  <main>
    <div id="scrollArea">
      <div class="status-msg" id="loadingMsg">Cargando...</div>
      <div class="grid" id="cardsGrid" style="display: none;"></div>
    </div>

    <!-- PANTALLA LIMPIA DE CONDUCCIÓN -->
    <div class="driving-view" id="drivingView" onclick="restoreCards()">
      <div class="driving-logo-box">
        <img id="drivingLogo" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23666'><path d='M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z'/></svg>" alt="Station">
      </div>
      <div class="driving-station-name" id="drivingTitle">Emisora en Vivo</div>
      <div class="driving-eq">
        <span class="eq-bar"></span>
        <span class="eq-bar"></span>
        <span class="eq-bar"></span>
        <span class="eq-bar"></span>
        <span class="eq-bar"></span>
      </div>
    </div>
  </main>

  <!-- BOTÓN FLOTANTE INFERIOR -->
  <button class="floating-cards-btn" id="restoreBtn" onclick="restoreCards()">
    <svg viewBox="0 0 24 24"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg>
    Ver emisoras
  </button>

  <!-- BARRA DE REPRODUCCIÓN -->
  <footer class="radio-player-bar" id="radioBar">
    <div class="player-track-info">
      <div class="player-logo-container">
        <img id="playerLogo" class="player-logo" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23666'><path d='M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z'/></svg>" alt="Logo">
      </div>
      <div class="player-texts">
        <div class="player-name" id="playerTitle">Seleccione una emisora</div>
        <div class="player-status-row">
          <div class="bar-equalizer" id="barEqualizer">
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
          </div>
          <span class="player-status" id="playerStatus">Listo</span>
        </div>
      </div>
    </div>

    <div class="player-controls">
      <button class="player-fav-btn" id="playerFavBtn" onclick="toggleFavoriteCurrent()" title="Añadir/Quitar de favoritos">
        <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
      </button>
      <button class="ctrl-btn" onclick="stopRadio()" title="Detener">
        <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
      </button>
      <button class="ctrl-btn play-btn" id="playPauseBtn" onclick="toggleRadioPlay()" title="Reproducir / Pausar">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pauseIcon" style="display:none;" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
    </div>
  </footer>

  <!-- REPRODUCTOR DE TV MODAL -->
  <div class="tv-modal" id="tvModal">
    <div class="tv-header">
      <div class="tv-title" id="tvChannelName">Canal de TV</div>
      <button class="tv-close-btn" onclick="closeTvModal()">✕ SALIR</button>
    </div>
    <div class="tv-video-container">
      <video id="tvVideo" controls autoplay playsinline></video>
    </div>
  </div>

  <!-- INPUT OCULTO PARA CARGAR ARCHIVO M3U LOCAL -->
  <input type="file" id="localM3uInput" accept=".m3u,.m3u8,.txt" style="display:none;" onchange="handleLocalM3uFile(event)">

  <audio id="radioAudio" preload="none"></audio>

  <script>
    const RADIO_URL = "https://raw.githubusercontent.com/sejo48/StreamTube-V20/refs/heads/main/radios.json";
    const TV_URL = "https://raw.githubusercontent.com/sejo48/StreamTube-V20/refs/heads/main/listaoficial.m3u";

    // ================== CLAVES DE PERSISTENCIA ==================
    const LS_KEYS = {
      favorites: 'boxplay_favorites',
      lastRadio: 'boxplay_last_radio',
      lastSection: 'boxplay_last_section',
      favFilter: 'boxplay_fav_filter'
    };

    let currentSection = 'radio';
    let radioList = [];
    let tvList = [];
    let tvError = null;
    let tvIsLoading = false;

    let currentRadio = null;
    let isRadioPlaying = false;
    let hideTimer = null;
    let areCardsHidden = false;

    // ---- FAVORITOS (Set de URLs únicas) ----
    let favorites = new Set();
    let showOnlyFavorites = false;

    const audioPlayer = document.getElementById('radioAudio');
    const tvVideo = document.getElementById('tvVideo');
    const radioBar = document.getElementById('radioBar');
    let hlsInstance = null;

    // ================== UTILIDADES DE PERSISTENCIA ==================
    function loadFavoritesFromStorage() {
      try {
        const raw = localStorage.getItem(LS_KEYS.favorites);
        if (raw) {
          const arr = JSON.parse(raw);
          if (Array.isArray(arr)) favorites = new Set(arr);
        }
      } catch (e) {
        console.warn('No se pudieron cargar favoritos:', e);
      }
    }

    function saveFavoritesToStorage() {
      try {
        localStorage.setItem(LS_KEYS.favorites, JSON.stringify([...favorites]));
      } catch (e) {
        console.warn('No se pudieron guardar favoritos:', e);
      }
    }

    function saveLastRadio(item) {
      try {
        if (!item) {
          localStorage.removeItem(LS_KEYS.lastRadio);
          return;
        }
        localStorage.setItem(LS_KEYS.lastRadio, JSON.stringify({
          name: item.name,
          url: item.url,
          logo: item.logo || '',
          category: item.category || 'Radio'
        }));
      } catch (e) { /* silencioso */ }
    }

    function loadLastRadio() {
      try {
        const raw = localStorage.getItem(LS_KEYS.lastRadio);
        return raw ? JSON.parse(raw) : null;
      } catch (e) { return null; }
    }

    function saveLastSection(section) {
      try { localStorage.setItem(LS_KEYS.lastSection, section); } catch (e) {}
    }

    function loadLastSection() {
      try {
        const s = localStorage.getItem(LS_KEYS.lastSection);
        return (s === 'radio' || s === 'tv') ? s : 'radio';
      } catch (e) { return 'radio'; }
    }

    function saveFavFilter(val) {
      try { localStorage.setItem(LS_KEYS.favFilter, val ? '1' : '0'); } catch (e) {}
    }

    function loadFavFilter() {
      try { return localStorage.getItem(LS_KEYS.favFilter) === '1'; } catch (e) { return false; }
    }

    // ================== ARRANQUE ==================
    window.addEventListener('DOMContentLoaded', () => {
      // Cargar estado persistido ANTES de pintar nada
      loadFavoritesFromStorage();
      showOnlyFavorites = loadFavFilter();
      currentSection = loadLastSection();

      // Ajustar UI inicial según sección persistida
      document.getElementById('tab-radio').classList.toggle('active', currentSection === 'radio');
      document.getElementById('tab-tv').classList.toggle('active', currentSection === 'tv');
      document.getElementById('favFilterBtn').classList.toggle('active', showOnlyFavorites);
      document.getElementById('favFilterBtn').classList.toggle('hidden', currentSection === 'tv');

      if (currentSection === 'tv') {
        document.body.classList.add('tv-mode');
        radioBar.style.display = 'none';
      }

      loadRadioData().then(() => {
        // Restaurar última emisora si existe (sin autoplay — requiere gesto del usuario)
        const last = loadLastRadio();
        if (last && last.url) {
          currentRadio = last;
          document.getElementById('playerTitle').textContent = last.name || 'Emisora';
          if (last.logo) document.getElementById('playerLogo').src = last.logo;
          updateRadioUI('LISTO PARA REPRODUCIR');
          updatePlayerFavBtn();
          renderGrid();
        }
      });

      loadTvData();

      audioPlayer.addEventListener('playing', () => {
        isRadioPlaying = true;
        updateRadioUI('EN VIVO');
        startAutoHideTimer();
        updatePlayerFavBtn();
      });

      audioPlayer.addEventListener('waiting', () => {
        updateRadioUI('SINTONIZANDO...');
      });

      audioPlayer.addEventListener('pause', () => {
        isRadioPlaying = false;
        clearTimeout(hideTimer);
        if (audioPlayer.currentTime > 0 && !audioPlayer.ended) {
          updateRadioUI('PAUSADO');
        }
      });

      audioPlayer.addEventListener('error', () => {
        isRadioPlaying = false;
        clearTimeout(hideTimer);
        restoreCards();
        updateRadioUI('ERROR DE TRANSMISIÓN');
      });

      document.getElementById('scrollArea').addEventListener('touchstart', resetTimerOnInteraction);
      document.getElementById('scrollArea').addEventListener('mousedown', resetTimerOnInteraction);
    });

    function resetTimerOnInteraction() {
      if (isRadioPlaying && !areCardsHidden) {
        startAutoHideTimer();
      }
    }

    // ================== FAVORITOS: LÓGICA ==================
    function toggleFavorite(item) {
      if (!item || !item.url) return;
      if (favorites.has(item.url)) {
        favorites.delete(item.url);
      } else {
        favorites.add(item.url);
      }
      saveFavoritesToStorage();
      renderGrid();
      updatePlayerFavBtn();
    }

    function toggleFavoriteCurrent() {
      if (!currentRadio) return;
      toggleFavorite(currentRadio);
    }

    function updatePlayerFavBtn() {
      const btn = document.getElementById('playerFavBtn');
      if (!currentRadio || !currentRadio.url) {
        btn.classList.remove('is-fav');
        return;
      }
      btn.classList.toggle('is-fav', favorites.has(currentRadio.url));
    }

    function toggleFavFilter() {
      showOnlyFavorites = !showOnlyFavorites;
      saveFavFilter(showOnlyFavorites);
      document.getElementById('favFilterBtn').classList.toggle('active', showOnlyFavorites);
      renderGrid();
    }

    // ================== TIMER AUTOHIDE ==================
    function startAutoHideTimer() {
      clearTimeout(hideTimer);
      if (currentSection !== 'radio' || !isRadioPlaying) return;

      hideTimer = setTimeout(() => {
        if (isRadioPlaying && currentSection === 'radio') {
          hideCards();
        }
      }, 5000);
    }

    function hideCards() {
      areCardsHidden = true;
      document.getElementById('scrollArea').style.display = 'none';
      document.getElementById('drivingView').classList.add('active');
      document.getElementById('restoreBtn').classList.add('visible');
      radioBar.style.display = 'none';

      if (currentRadio) {
        document.getElementById('drivingTitle').textContent = currentRadio.name;
        if (currentRadio.logo) {
          document.getElementById('drivingLogo').src = currentRadio.logo;
        }
      }
    }

    function restoreCards() {
      areCardsHidden = false;
      clearTimeout(hideTimer);
      document.getElementById('scrollArea').style.display = 'block';
      document.getElementById('drivingView').classList.remove('active');
      document.getElementById('restoreBtn').classList.remove('visible');

      if (currentSection === 'radio') {
        radioBar.style.display = 'flex';
      }

      if (isRadioPlaying && currentSection === 'radio') {
        startAutoHideTimer();
      }
    }

    function switchSection(section) {
      currentSection = section;
      saveLastSection(section);
      restoreCards();
      document.getElementById('searchInput').value = '';
      document.getElementById('tab-radio').classList.toggle('active', section === 'radio');
      document.getElementById('tab-tv').classList.toggle('active', section === 'tv');
      document.getElementById('favFilterBtn').classList.toggle('hidden', section === 'tv');

      if (section === 'tv') {
        document.body.classList.add('tv-mode');
        radioBar.style.display = 'none';
        if (!audioPlayer.paused) {
          audioPlayer.pause();
          isRadioPlaying = false;
          updateRadioUI('PAUSADO');
        }
        if (tvList.length === 0 && !tvIsLoading) {
          loadTvData();
        }
      } else {
        document.body.classList.remove('tv-mode');
        radioBar.style.display = areCardsHidden ? 'none' : 'flex';
      }

      renderGrid();
    }

    // ================== CARGA DE DATOS ==================
    async function loadRadioData() {
      try {
        const res = await fetch(RADIO_URL);
        const data = await res.json();
        const rawItems = Array.isArray(data) ? data : (data.radios || data.emisoras || data.stations || Object.values(data));

        radioList = rawItems.map(item => ({
          name: item.name || item.nombre || item.title || 'Emisora',
          url: item.url || item.stream || item.link || item.src,
          logo: item.logo || item.image || item.img || item.icon || '',
          category: item.genre || item.genero || item.pais || 'Radio'
        })).filter(item => item.url);

        if (currentSection === 'radio') renderGrid();
      } catch (err) {
        console.error('Error cargando radios:', err);
      }
    }

    async function loadTvData() {
      tvIsLoading = true;
      tvError = null;
      if (currentSection === 'tv') {
        document.getElementById('loadingMsg').style.display = 'flex';
        document.getElementById('loadingMsg').innerHTML = 'Conectando con lista oficial M3U...';
        document.getElementById('cardsGrid').style.display = 'none';
      }

      try {
        const res = await fetch(TV_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);
        const text = await res.text();
        tvList = parseM3U(text);
        if (tvList.length === 0) throw new Error('La lista se descargó pero no se encontraron canales.');
        console.log(`Canales de TV cargados: ${tvList.length}`);
      } catch (err) {
        console.error('Error cargando TV:', err);
        tvError = err.message;
      } finally {
        tvIsLoading = false;
        if (currentSection === 'tv') renderGrid();
      }
    }

    function triggerLocalM3u() {
      document.getElementById('localM3uInput').click();
    }

    function handleLocalM3uFile(e) {
      const file = e.target.files.at(0);
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        tvList = parseM3U(evt.target.result);
        tvError = null;
        if (currentSection === 'tv') renderGrid();
      };
      reader.readAsText(file);
    }

    function parseM3U(m3uText) {
      if (!m3uText || typeof m3uText !== 'string') return [];
      const clean = m3uText.replace(/^\uFEFF/, '');
      const lines = clean.split(/\r?\n/);
      const items = [];
      let currentInfo = null;

      for (let i = 0; i < lines.length; i++) {
        const line = lines.at(i).trim();
        if (!line) continue;

        if (line.toUpperCase().startsWith('#EXTINF')) {
          const logoMatch = /(?:tvg-logo|logo)="([^"]*)"/i.exec(line);
          const logo = logoMatch ? logoMatch.at(1).trim() : '';
          const groupMatch = /group-title="([^"]*)"/i.exec(line);
          const category = groupMatch ? groupMatch.at(1).trim() : 'TV';
          const commaIndex = line.indexOf(',');
          let name = commaIndex !== -1 ? line.substring(commaIndex + 1).trim() : '';
          if (!name) {
            const tvgNameMatch = /tvg-name="([^"]*)"/i.exec(line);
            name = tvgNameMatch ? tvgNameMatch.at(1).trim() : 'Canal';
          }
          currentInfo = { name, logo, category };
        } else if (!line.startsWith('#') && currentInfo) {
          currentInfo.url = line;
          items.push(currentInfo);
          currentInfo = null;
        }
      }
      return items;
    }

    // ================== RENDER ==================
    function renderGrid() {
      const grid = document.getElementById('cardsGrid');
      const loading = document.getElementById('loadingMsg');
      const filter = document.getElementById('searchInput').value.toLowerCase().trim();
      const list = currentSection === 'radio' ? radioList : tvList;

      if (currentSection === 'tv' && tvError && tvList.length === 0) {
        loading.style.display = 'flex';
        loading.innerHTML = `
          <div style="color: var(--accent-tv); font-weight: bold; font-size: 18px;">No se pudo descargar la lista de TV</div>
          <div style="font-size: 14px; max-width: 90%; color: var(--text-secondary);">${tvError}</div>
          <div style="display: flex; gap: 12px; margin-top: 8px;">
            <button class="btn-action btn-tv-action" onclick="loadTvData()">Reintentar conexión</button>
            <button class="btn-action btn-secondary" onclick="triggerLocalM3u()">Cargar M3U desde USB</button>
          </div>
        `;
        grid.style.display = 'none';
        return;
      }

      if (!list || list.length === 0) {
        loading.style.display = 'flex';
        loading.innerHTML = `Cargando ${currentSection === 'radio' ? 'emisoras' : 'canales'}...`;
        grid.style.display = 'none';
        return;
      }

      loading.style.display = 'none';
      grid.style.display = 'grid';
      grid.innerHTML = '';

      let filtered = list.filter(item =>
        item.name.toLowerCase().includes(filter) ||
        (item.category && item.category.toLowerCase().includes(filter))
      );

      // Filtro de favoritos solo aplica en radio
      if (currentSection === 'radio' && showOnlyFavorites) {
        filtered = filtered.filter(item => favorites.has(item.url));
      }

      if (filtered.length === 0) {
        const msg = (currentSection === 'radio' && showOnlyFavorites && !filter)
          ? 'Aún no tienes emisoras favoritas. Toca la ⭐ en una tarjeta para añadirla.'
          : `Sin resultados para "${filter}".`;
        grid.innerHTML = `<div class="status-msg" style="grid-column: 1/-1;">${msg}</div>`;
        return;
      }

      filtered.forEach((item) => {
        const isCurrentRadioPlaying = (currentSection === 'radio' && currentRadio && currentRadio.url === item.url && isRadioPlaying);
        const isFav = favorites.has(item.url);
        const isRadio = currentSection === 'radio';

        const card = document.createElement('div');
        card.className = `card ${isCurrentRadioPlaying ? 'is-playing' : ''} ${(isRadio && isFav) ? 'is-favorite' : ''}`;

        const fallbackIcon = isRadio ? '📻' : '📺';
        const imgHtml = item.logo
          ? `<img src="${item.logo}" alt="${item.name}" onerror="this.onerror=null; this.parentElement.innerHTML='<span class=\\'placeholder-icon\\'>${fallbackIcon}</span>'">`
          : `<span class="placeholder-icon">${fallbackIcon}</span>`;

        const favBtnHtml = isRadio
          ? `<button class="card-fav-btn ${isFav ? 'is-fav' : ''}" title="${isFav ? 'Quitar de favoritos' : 'Añadir a favoritos'}">
               <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
             </button>`
          : '';

        card.innerHTML = `
          ${favBtnHtml}
          <div class="card-equalizer-badge">
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
          </div>
          <div class="card-img-wrapper">${imgHtml}</div>
          <div class="card-title">${item.name}</div>
          <div class="card-tag">${item.category || currentSection.toUpperCase()}</div>
        `;

        // Click en la tarjeta = reproducir
        card.onclick = () => {
          if (isRadio) playRadio(item);
          else playTv(item);
        };

        // Click en la estrella = alternar favorito (detener propagación)
        if (isRadio) {
          const favBtn = card.querySelector('.card-fav-btn');
          favBtn.addEventListener('click', (ev) => {
            ev.stopPropagation();
            toggleFavorite(item);
          });
        }

        grid.appendChild(card);
      });
    }

    function filterItems() { renderGrid(); }

    // ================== RADIO ==================
    function playRadio(item) {
      currentRadio = item;
      saveLastRadio(item);           // Persistir última emisora
      document.getElementById('playerTitle').textContent = item.name;
      if (item.logo) document.getElementById('playerLogo').src = item.logo;
      updateRadioUI('CONECTANDO...');
      updatePlayerFavBtn();

      audioPlayer.src = item.url;
      audioPlayer.play().catch(err => {
        console.error('Error al reproducir audio:', err);
        updateRadioUI('ERROR AL CONECTAR');
      });

      renderGrid();
      startAutoHideTimer();
    }

    function toggleRadioPlay() {
      if (!audioPlayer.src) return;
      if (audioPlayer.paused) audioPlayer.play();
      else audioPlayer.pause();
    }

    function stopRadio() {
      clearTimeout(hideTimer);
      audioPlayer.pause();
      audioPlayer.src = '';
      currentRadio = null;
      isRadioPlaying = false;
      saveLastRadio(null);           // Limpiar última emisora
      document.getElementById('playerTitle').textContent = 'Seleccione una emisora';
      document.getElementById('playerLogo').src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23666'><path d='M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z'/></svg>";
      restoreCards();
      updateRadioUI('DETENIDO');
      updatePlayerFavBtn();
      renderGrid();
    }

    function updateRadioUI(statusText) {
      document.getElementById('playerStatus').textContent = statusText;
      document.getElementById('playIcon').style.display = isRadioPlaying ? 'none' : 'block';
      document.getElementById('pauseIcon').style.display = isRadioPlaying ? 'block' : 'none';
      document.getElementById('barEqualizer').classList.toggle('active', isRadioPlaying);
      renderGrid();
    }

    // ================== TV ==================
    function playTv(item) {
      clearTimeout(hideTimer);
      if (!audioPlayer.paused) {
        audioPlayer.pause();
        isRadioPlaying = false;
        updateRadioUI('PAUSADO');
      }

      const modal = document.getElementById('tvModal');
      document.getElementById('tvChannelName').textContent = item.name;
      modal.classList.add('active');

      if (Hls.isSupported() && (item.url.includes('.m3u8') || item.url.includes('m3u'))) {
        if (hlsInstance) hlsInstance.destroy();
        hlsInstance = new Hls({ enableWorker: true, lowLatencyMode: true });
        hlsInstance.loadSource(item.url);
        hlsInstance.attachMedia(tvVideo);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          tvVideo.play().catch(e => console.log('Autoplay bloqueado:', e));
        });
      } else {
        tvVideo.src = item.url;
        tvVideo.play().catch(e => console.log('Autoplay bloqueado:', e));
      }
    }

    function closeTvModal() {
      const modal = document.getElementById('tvModal');
      modal.classList.remove('active');
      tvVideo.pause();
      tvVideo.src = '';
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
    }
  </script>
</body>
</html>
