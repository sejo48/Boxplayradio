<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Box Play Media Suite</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- HLS.js para streams de TV y Radio .m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            500: '#ec4899',
                            600: '#db2777',
                        }
                    }
                }
            }
        };
    </script>

    <style>
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #020617;
        }
        ::-webkit-scrollbar-thumb {
            background: #db2777;
            border-radius: 9999px;
        }
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* Tarjeta Cuadrada de Radio y TV */
        .car-media-square {
            aspect-ratio: 1 / 1;
            position: relative;
            overflow: hidden;
            background: #090d1a;
            border: 2px solid rgba(255, 255, 255, 0.12);
            transition: transform 0.12s ease, border-color 0.12s ease;
        }
        .car-media-square:active {
            transform: scale(0.96);
            border-color: #db2777;
        }

        /* Animación del Ecualizador en la Cabecera */
        @keyframes soundWave {
            0% { height: 15%; }
            50% { height: 100%; }
            100% { height: 25%; }
        }
        .bar-anim {
            height: 20%;
            transition: height 0.2s ease;
        }
        .visualizer-active .bar-1 { animation: soundWave 0.65s infinite ease-in-out alternate; }
        .visualizer-active .bar-2 { animation: soundWave 0.45s infinite 0.1s ease-in-out alternate; }
        .visualizer-active .bar-3 { animation: soundWave 0.75s infinite 0.25s ease-in-out alternate; }
        .visualizer-active .bar-4 { animation: soundWave 0.5s infinite 0.15s ease-in-out alternate; }
        .visualizer-active .bar-5 { animation: soundWave 0.85s infinite 0.3s ease-in-out alternate; }
        .visualizer-active .bar-6 { animation: soundWave 0.4s infinite 0.05s ease-in-out alternate; }

        /* Transiciones suaves */
        #topHeader {
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #bottomPlayer {
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col font-sans overflow-hidden">

    <!-- Header Ultra-Compacto -->
    <header id="topHeader" class="fixed top-0 left-0 right-0 h-12 bg-slate-900/98 backdrop-blur-md border-b-2 border-slate-800 px-4 flex items-center justify-between shadow-xl z-50">
        
        <!-- Logotipo y Título -->
        <div class="flex items-center space-x-2.5 flex-shrink-0">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-pink-600 to-purple-600 flex items-center justify-center shadow-md">
                <i class="fa-solid fa-car text-white text-sm"></i>
            </div>
            <span class="text-base font-black tracking-tight text-white" id="appMainTitle">BoxPlay Radio</span>
            <span id="modeBadge" class="text-[9px] px-1.5 py-0.2 rounded bg-pink-600/30 text-pink-400 border border-pink-500/40 font-black uppercase">RADIO</span>
        </div>

        <!-- Ecualizador de Barras en Cabecera -->
        <div id="headerVisualizer" class="flex items-center space-x-2 px-2.5 py-1 bg-slate-950/80 rounded-lg border border-slate-800 flex-shrink-0">
            <i id="headerModeIcon" class="fa-solid fa-radio text-pink-500 text-xs"></i>
            <div id="visualizerBars" class="flex items-end space-x-1 h-4 w-14">
                <span class="w-1 bg-pink-500 rounded-full bar-anim bar-1"></span>
                <span class="w-1 bg-pink-400 rounded-full bar-anim bar-2"></span>
                <span class="w-1 bg-purple-400 rounded-full bar-anim bar-3"></span>
                <span class="w-1 bg-pink-500 rounded-full bar-anim bar-4"></span>
                <span class="w-1 bg-purple-500 rounded-full bar-anim bar-5"></span>
                <span class="w-1 bg-pink-400 rounded-full bar-anim bar-6"></span>
            </div>
        </div>

        <!-- Selector de Sección: Radio vs TV -->
        <div class="flex items-center space-x-1.5 flex-shrink-0">
            <div class="flex bg-slate-950 p-0.5 rounded-lg border border-slate-800">
                <button onclick="switchMode('radio')" id="tabRadioBtn" class="px-3 py-1 rounded-md font-bold text-xs flex items-center space-x-1.5 transition-all bg-pink-600 text-white shadow">
                    <i class="fa-solid fa-radio text-xs"></i>
                    <span>Radio</span>
                </button>
                <button onclick="switchMode('tv')" id="tabTvBtn" class="px-3 py-1 rounded-md font-bold text-xs flex items-center space-x-1.5 transition-all text-slate-400 hover:text-white">
                    <i class="fa-solid fa-tv text-xs"></i>
                    <span>TV</span>
                </button>
            </div>

            <button onclick="toggleFavoritesFilter()" id="favFilterBtn" class="w-9 h-8 rounded-lg bg-slate-800 border border-slate-700 hover:border-pink-500 text-slate-200 flex items-center justify-center transition-all shadow" title="Favoritas">
                <i class="fa-solid fa-heart text-pink-500 text-sm"></i>
            </button>

            <button onclick="openSearchModal()" class="w-9 h-8 rounded-lg bg-slate-800 border border-slate-700 hover:border-pink-500 text-slate-200 flex items-center justify-center transition-all shadow" title="Buscar">
                <i class="fa-solid fa-magnifying-glass text-pink-400 text-sm"></i>
            </button>

            <button onclick="toggleFullScreen()" class="w-9 h-8 rounded-lg bg-slate-800 border border-slate-700 text-slate-200 hover:text-pink-400 flex items-center justify-center transition-all shadow" title="Pantalla Completa">
                <i id="fsIcon" class="fa-solid fa-expand text-sm"></i>
            </button>

            <button onclick="hideControls()" class="w-9 h-8 rounded-lg bg-slate-800 border border-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition-all" title="Ocultar Menú">
                <i class="fa-solid fa-chevron-up text-sm"></i>
            </button>
        </div>
    </header>

    <!-- Área de Cuadrícula de Tarjetas -->
    <main id="mainContainer" class="flex-1 overflow-y-auto px-4 py-3 bg-slate-950 pt-14 pb-14" onclick="handleMainTap()">
        
        <!-- Banner de Favoritos Activo -->
        <div id="favoritesActiveBanner" class="hidden mb-3 p-2.5 rounded-xl bg-pink-950/40 border border-pink-500/50 items-center justify-between shadow-lg">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-heart text-pink-500 text-sm"></i>
                <span class="text-xs font-bold text-white">Mostrando Favoritos Guardados</span>
            </div>
            <button onclick="exitFavorites()" class="px-3 py-1 rounded-lg bg-slate-900 border border-pink-500 text-pink-400 hover:bg-pink-600 hover:text-white font-bold text-[11px] transition-all">
                Ver Todo
            </button>
        </div>

        <!-- Mensajes de Notificación -->
        <div id="statusMessage" class="hidden mb-3 p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-xs flex items-center justify-between text-slate-300 shadow-xl">
            <div class="flex items-center space-x-2">
                <i id="statusIcon" class="fa-solid fa-circle-info text-pink-400"></i>
                <span id="statusText">Cargando canales y emisoras...</span>
            </div>
            <button onclick="closeStatus()" class="p-1 text-slate-400 hover:text-white">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>
        </div>

        <!-- Skeletons de Carga -->
        <div id="loadingState" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3">
            <div class="bg-slate-900 rounded-xl animate-pulse aspect-square"></div>
            <div class="bg-slate-900 rounded-xl animate-pulse aspect-square"></div>
            <div class="bg-slate-900 rounded-xl animate-pulse aspect-square"></div>
            <div class="bg-slate-900 rounded-xl animate-pulse aspect-square"></div>
            <div class="bg-slate-900 rounded-xl animate-pulse aspect-square"></div>
            <div class="bg-slate-900 rounded-xl animate-pulse aspect-square"></div>
        </div>

        <!-- Contenedor Dinámico de Tarjetas Cuadradas -->
        <div id="contentGrid" class="hidden">
        </div>

        <!-- Estado Vacío -->
        <div id="emptyState" class="hidden flex flex-col items-center justify-center py-12 text-center">
            <div class="w-16 h-16 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-500 text-2xl mb-2">
                <i class="fa-solid fa-tv"></i>
            </div>
            <h3 class="text-base font-bold text-slate-200">No se encontraron elementos</h3>
            <p class="text-xs text-slate-400 mt-1">Verifica tu conexión o cambia de sección.</p>
        </div>
    </main>

    <!-- Botón Flotante Discreto -->
    <button id="playerHandleBtn" onclick="showControlsWithTimeout(5)" class="fixed bottom-2.5 left-1/2 -translate-x-1/2 bg-slate-900/95 backdrop-blur-md border border-pink-500/70 text-white px-4 py-1.5 rounded-full shadow-2xl flex items-center space-x-2.5 z-40 transition-all duration-300 transform translate-y-16 opacity-0 pointer-events-none active:scale-95">
        <i class="fa-solid fa-waveform text-pink-400 text-sm animate-pulse"></i>
        <span id="handleTitle" class="text-xs font-bold text-white truncate max-w-[180px]">BoxPlay</span>
        <i class="fa-solid fa-bars text-pink-400 text-xs ml-1"></i>
    </button>

    <!-- Reproductor Inferior de Radio (Se oculta a los 5 segundos) -->
    <footer id="bottomPlayer" class="fixed bottom-0 left-0 right-0 bg-slate-900/98 backdrop-blur-md border-t-2 border-pink-600 px-4 py-2 z-50 shadow-2xl translate-y-full">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-3">
            
            <div class="flex items-center space-x-2.5 min-w-0 flex-1">
                <div class="relative w-11 h-11 rounded-lg overflow-hidden bg-slate-950 flex-shrink-0 border border-slate-700 shadow">
                    <img id="playerImg" src="https://placehold.co/150x150/1e293b/ec4899?text=BOX" alt="Logo" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/150x150/1e293b/ec4899?text=BOX'">
                </div>
                <div class="min-w-0">
                    <h4 id="playerTitle" class="text-sm font-bold text-white truncate">Selecciona una emisora</h4>
                    <p id="playerCategory" class="text-[11px] text-pink-400 font-semibold truncate">Listo</p>
                </div>
            </div>

            <!-- Controles Centrales -->
            <div class="flex items-center space-x-2">
                <button onclick="playPrevious()" class="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 hover:text-white flex items-center justify-center text-base transition-all active:scale-95" title="Anterior">
                    <i class="fa-solid fa-backward-step"></i>
                </button>

                <button onclick="togglePlayPause()" id="playPauseBtn" disabled class="w-12 h-12 rounded-xl bg-pink-600 hover:bg-pink-500 disabled:bg-slate-800 disabled:text-slate-600 text-white flex items-center justify-center shadow-lg shadow-pink-600/40 transition-transform active:scale-95">
                    <i id="playPauseIcon" class="fa-solid fa-play text-xl ml-0.5"></i>
                </button>

                <button onclick="playNext()" class="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 hover:text-white flex items-center justify-center text-base transition-all active:scale-95" title="Siguiente">
                    <i class="fa-solid fa-forward-step"></i>
                </button>

                <div id="spinnerLoader" class="hidden w-8 h-8 border-3 border-pink-500 border-t-transparent rounded-full animate-spin"></div>

                <button onclick="toggleFavoriteCurrent()" id="playerFavBtn" class="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700 hover:border-pink-500 text-slate-300 hover:text-pink-500 flex items-center justify-center text-lg transition-all">
                    <i class="fa-regular fa-heart"></i>
                </button>

                <button onclick="hideControls()" class="w-9 h-9 rounded-xl bg-slate-800/80 border border-slate-700 text-slate-400 hover:text-white flex items-center justify-center text-xs transition-all" title="Ocultar">
                    <i class="fa-solid fa-chevron-down"></i>
                </button>
            </div>

            <!-- Volumen -->
            <div class="hidden sm:flex items-center space-x-2 w-36 justify-end">
                <button onclick="toggleMute()" id="muteBtn" class="p-1 text-slate-300 hover:text-white">
                    <i id="muteIcon" class="fa-solid fa-volume-high text-base"></i>
                </button>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1" class="w-24 accent-pink-500 bg-slate-800 rounded-lg h-2 cursor-pointer">
            </div>

        </div>
    </footer>

    <!-- Visor de Televisión en Vivo (Video Player) -->
    <div id="tvPlayerModal" class="fixed inset-0 bg-black z-50 flex flex-col hidden">
        <div class="absolute top-0 left-0 right-0 p-3 bg-gradient-to-b from-black/90 via-black/50 to-transparent z-20 flex items-center justify-between">
            <div class="flex items-center space-x-3 min-w-0">
                <img id="tvModalLogo" src="" class="w-9 h-9 rounded-lg object-contain bg-slate-900 border border-slate-800">
                <div class="min-w-0">
                    <h3 id="tvModalTitle" class="text-sm md:text-base font-black text-white truncate drop-shadow">Canal</h3>
                    <span id="tvModalGroup" class="text-[10px] text-pink-400 font-bold uppercase drop-shadow">En Vivo</span>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <button onclick="playPrevious()" class="w-10 h-10 rounded-xl bg-slate-900/80 border border-slate-700 text-white flex items-center justify-center text-base" title="Canal Anterior">
                    <i class="fa-solid fa-backward-step"></i>
                </button>
                <button onclick="playNext()" class="w-10 h-10 rounded-xl bg-slate-900/80 border border-slate-700 text-white flex items-center justify-center text-base" title="Canal Siguiente">
                    <i class="fa-solid fa-forward-step"></i>
                </button>
                <button onclick="toggleTvFullScreen()" class="w-10 h-10 rounded-xl bg-slate-900/80 border border-slate-700 text-white flex items-center justify-center text-base" title="Pantalla Completa">
                    <i class="fa-solid fa-expand"></i>
                </button>
                <button onclick="closeTvPlayer()" class="px-4 py-2 rounded-xl bg-pink-600 hover:bg-pink-500 text-white font-bold text-xs flex items-center space-x-1.5 shadow-lg">
                    <i class="fa-solid fa-xmark"></i>
                    <span>Cerrar TV</span>
                </button>
            </div>
        </div>

        <div class="flex-1 w-full h-full flex items-center justify-center bg-black relative">
            <video id="tvVideo" class="w-full h-full object-contain" playsinline controls autoplay></video>
            <div id="tvLoadingSpinner" class="hidden absolute inset-0 bg-black/60 flex items-center justify-center">
                <div class="w-12 h-12 border-4 border-pink-500 border-t-transparent rounded-full animate-spin"></div>
            </div>
        </div>
    </div>

    <!-- Modal de Búsqueda -->
    <div id="searchModal" class="fixed inset-0 bg-slate-950/95 backdrop-blur-md z-50 flex flex-col p-4 hidden">
        <div class="max-w-3xl mx-auto w-full flex-1 flex flex-col">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-base md:text-lg font-black text-white" id="searchModalTitle">Buscar</h3>
                <button onclick="closeSearchModal()" class="px-4 py-1.5 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 font-bold text-xs">Cerrar</button>
            </div>
            <div class="relative w-full mb-3">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-base"></i>
                <input type="text" id="modalSearchInput" placeholder="Escribe para buscar..." class="w-full bg-slate-900 border border-slate-700 text-sm md:text-base rounded-xl pl-10 pr-3 py-2 text-white placeholder-slate-500 focus:outline-none focus:border-pink-500 transition-all shadow-inner">
            </div>
            <div id="searchResultsContainer" class="flex-1 overflow-y-auto space-y-2 pb-6">
            </div>
        </div>
    </div>

    <!-- Audio Element -->
    <audio id="audioStream" preload="none"></audio>

    <script>
        // URLs oficiales de tu repositorio
        const RADIO_JSON_URL = 'https://raw.githubusercontent.com/sejo48/StreamTube-V20/refs/heads/main/radios.json';
        const TV_M3U_URL = 'https://raw.githubusercontent.com/sejo48/StreamTube-V20/refs/heads/main/listaoficial.m3u';

        // Canales y emisoras de respaldo garantizadas (por si se abre con file:// sin internet o con CORS)
        const FALLBACK_RADIOS = [
            { title: "Radio Sinfonola 90.3 FM", group: "Nacionales", genre: "Clásicos y Recuerdos", logo: "https://static.mytuner.mobi/media/tvos_radios/415/radio-sinfonola.79d5c3e6.png", url: "https://live.turadio.stream:7006/;" },
            { title: "Best FM 103.5", group: "Nacionales", genre: "Classic Hits 80-90s", logo: "https://placehold.co/300x300/3b82f6/ffffff?text=Best+FM", url: "https://live.turadio.stream:7004/stream?nocache=596&type=http" },
            { title: "Radio Disney 101.1 FM", group: "Nacionales", genre: "Pop Juvenil", logo: "https://static.mytuner.mobi/media/tvos_radios/652/radio-disney-costa-rica.d297c76c.jpg", url: "https://26673.live.streamtheworld.com/DISNEY_CRI_SJ_ADP/HLS/031b1ae7-b742-4bf3-8001-31b8478440ef/0/playlist.m3u8" },
            { title: "Los 40 104.3 FM", group: "Nacionales", genre: "Pop / Urbano", logo: "https://placehold.co/300x300/14b8a6/000000?text=Los40", url: "https://icecasthd.teletica.com/los40" },
            { title: "Radio Bolero 97.7", group: "Nacionales", genre: "Romántica", logo: "https://static2.mytuner.mobi/media/tvos_radios/368/radio-bolero-spain.6e20e2e3.jpg", url: "https://romanticafm.radioca.st/;" }
        ];

        const FALLBACK_TV = [
            { title: "Telered", group: "Noticias Local", logo: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRc0CFBLpTdVRLyxhsV8Hq3wfIeJAPWiC2TQOhBNoFV893ShXipE0MWXG9nhjQnTPIsMtK&usqp=CAU", url: "https://k20.usastreams.com:8081/telered/index.m3u8" },
            { title: "Canal 8", group: "Multimedios CR", logo: "https://pbs.twimg.com/profile_images/1510311834800246787/sfWgWmqk_400x400.jpg", url: "https://mdstrm.com/live-stream-playlist/5a7b1e63a8da282c34d65445/master.m3u8" },
            { title: "Tele Sistema", group: "Entretenimiento", logo: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR9YKvejKbdJWBUfmO0c32tKTO1QKQXXu2s4A&s", url: "https://k20.usastreams.com:8081/telesistema/tracks-v1a1/mono.m3u8" },
            { title: "TDTV", group: "Canal Turrialba", logo: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRIolIQw2AJvIdVjUFVAwAxLgPALnvBMWGyFw&s", url: "https://cloudvideo.servers10.com:8081/8230/tracks-v1a1/mono.m3u8" },
            { title: "Retro TV", group: "Canal Retro", logo: "https://play-lh.googleusercontent.com/zLkTnFdGGq5-cuY0DBvsCoiRUToWFA8rcm_Z3ieUr7rwgmzyojRXIfqMXt9dm4ocjs", url: "https://stream.enlineatv.net/hls/retrotv/1_2/index.m3u8?tkn=3610870340" }
        ];

        // Manejo Seguro de Almacenamiento Local (Protegido contra bloqueo file://)
        function safeGetStorage(key, defaultVal = []) {
            try {
                if (typeof window !== 'undefined' && window.localStorage) {
                    const val = localStorage.getItem(key);
                    return val ? JSON.parse(val) : defaultVal;
                }
            } catch (e) {
                console.warn('Almacenamiento restringido:', e);
            }
            return defaultVal;
        }

        function safeSetStorage(key, val) {
            try {
                if (typeof window !== 'undefined' && window.localStorage) {
                    localStorage.setItem(key, JSON.stringify(val));
                }
            } catch (e) {
                console.warn('Almacenamiento restringido:', e);
            }
        }

        let currentMode = 'radio';
        let stations = [];
        let tvChannels = [];
        let currentRadioItem = null;
        let currentTvItem = null;
        let searchQuery = '';
        let favoritesOnly = false;
        let renderedGridItems = [];
        let renderedSearchItems = [];

        let radioFavorites = safeGetStorage('box_play_radio_favs', []);
        let tvFavorites = safeGetStorage('box_play_tv_favs', []);

        let radioHls = null;
        let tvHls = null;
        let reconnectAttempts = 0;
        const MAX_RECONNECT_ATTEMPTS = 3;
        let statusTimeout = null;
        let controlsHideTimer = null;
        const AUTO_HIDE_SECONDS = 5;

        // Referencias del DOM
        let audio, tvVideo, tvPlayerModal, tvLoadingSpinner, tvModalLogo, tvModalTitle, tvModalGroup;
        let mainContainer, contentGrid, loadingState, emptyState, playPauseBtn, playPauseIcon, spinnerLoader;
        let playerTitle, playerCategory, playerImg, playerFavBtn, volumeSlider, muteBtn, muteIcon;
        let favFilterBtn, searchModal, modalSearchInput, searchResultsContainer, favoritesActiveBanner;
        let tabRadioBtn, tabTvBtn, modeBadge, appMainTitle, headerModeIcon, topHeader, bottomPlayer, playerHandleBtn, handleTitle, visualizerBars;

        // Registro de funciones en window para garantizar disponibilidad en onclick
        window.switchMode = function(mode) {
            if (currentMode === mode) return;
            currentMode = mode;
            searchQuery = '';
            
            if (mode === 'radio') {
                tabRadioBtn.className = "px-3 py-1 rounded-md font-bold text-xs flex items-center space-x-1.5 transition-all bg-pink-600 text-white shadow";
                tabTvBtn.className = "px-3 py-1 rounded-md font-bold text-xs flex items-center space-x-1.5 transition-all text-slate-400 hover:text-white";
                modeBadge.textContent = "RADIO";
                headerModeIcon.className = "fa-solid fa-radio text-pink-500 text-xs";
                appMainTitle.textContent = "BoxPlay Radio";
            } else {
                tabTvBtn.className = "px-3 py-1 rounded-md font-bold text-xs flex items-center space-x-1.5 transition-all bg-pink-600 text-white shadow";
                tabRadioBtn.className = "px-3 py-1 rounded-md font-bold text-xs flex items-center space-x-1.5 transition-all text-slate-400 hover:text-white";
                modeBadge.textContent = "TV EN VIVO";
                headerModeIcon.className = "fa-solid fa-tv text-pink-500 text-xs";
                appMainTitle.textContent = "BoxPlay TV";
                bottomPlayer.classList.add('translate-y-full');
            }

            renderCurrentContent();
            updateFavoritesBadge();
            keepControlsAlive();
        };

        window.handleMainTap = function() {

        // Lector / Parser de Lista M3U
        function parseM3U(m3uText) {
            if (!m3uText) return [];
            const lines = m3uText.split(/\r?\n/);
            const list = [];
            let current = null;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                if (line.startsWith('#EXTINF:')) {
                    current = {};
                    const nameMatch = line.match(/tvg-name="([^"]+)"/i);
                    const logoMatch = line.match(/tvg-logo="([^"]+)"/i);
                    const groupMatch = line.match(/group-title="([^"]+)"/i);
                    
                    const commaIdx = line.lastIndexOf(',');
                    let displayName = '';
                    if (commaIdx !== -1) {
                        displayName = line.substring(commaIdx + 1).trim();
                    }

                    current.title = displayName || (nameMatch ? nameMatch : 'Canal TV');
                    current.logo = logoMatch ? logoMatch : 'https://placehold.co/300x300/1e293b/ec4899?text=TV';
                    current.group = groupMatch ? groupMatch.replace(/\.$/, '') : 'En Vivo';
                } else if (!line.startsWith('#') && current) {
                    current.url = line;
                    list.push(current);
                    current = null;
                }
            }
            return list;
        }

        async function loadAllData() {
            loadingState.classList.remove('hidden');
            contentGrid.classList.add('hidden');
            emptyState.classList.add('hidden');
            showStatus('Cargando señales...', 'info');

            const cacheBuster = `?_t=${Date.now()}`;

            try {
                const [radioRes, tvRes] = await Promise.all([
                    fetch(RADIO_JSON_URL + cacheBuster).catch(() => null),
                    fetch(TV_M3U_URL + cacheBuster).catch(() => null)
                ]);

                if (radioRes && radioRes.ok) {
                    const rData = await radioRes.json();
                    stations = Array.isArray(rData) ? rData : (rData.radios || []);
                }
                if (!stations || stations.length === 0) {
                    stations = FALLBACK_RADIOS;
                }

                if (tvRes && tvRes.ok) {
                    const tvText = await tvRes.text();
                    tvChannels = parseM3U(tvText);
                }
                if (!tvChannels || tvChannels.length === 0) {
                    tvChannels = FALLBACK_TV;
                }

                renderCurrentContent();
                hideStatus();
                keepControlsAlive(AUTO_HIDE_SECONDS);
            } catch (error) {
                console.warn(error);
                stations = FALLBACK_RADIOS;
                tvChannels = FALLBACK_TV;
                renderCurrentContent();
                hideStatus();
                keepControlsAlive(AUTO_HIDE_SECONDS);
            }
        }

        function playRadio(station) {
            stopTv();
            currentRadioItem = station;
            setLoadingState(true);
            stopAndCleanupAudio();
            updatePlayerInfo();

            const streamUrl = station.url;
            if (!streamUrl) {
                showStatus('Flujo no disponible.', 'error');
                setLoadingState(false);
                return;
            }

            const isHls = streamUrl.toLowerCase().includes('.m3u8');

            if (isHls && Hls.isSupported()) {
                radioHls = new Hls({ enableWorker: true, lowLatencyMode: true });
                radioHls.loadSource(streamUrl);
                radioHls.attachMedia(audio);
                radioHls.on(Hls.Events.MANIFEST_PARSED, () => startAudioPlayback());
                radioHls.on(Hls.Events.ERROR, (e, data) => {
                    if (data.fatal) {
                        stopAndCleanupAudio();
                        handleAudioError();
                    }
                });
            } else {
                audio.src = streamUrl;
                startAudioPlayback();
            }

            renderCurrentContent();
        }

        function playTvChannel(channel) {
            stopAndCleanupAudio();
            setIsPlaying(false);

            currentTvItem = channel;
            tvModalLogo.src = channel.logo || 'https://placehold.co/150x150/1e293b/ec4899?text=TV';
            tvModalTitle.textContent = channel.title;
            tvModalGroup.textContent = channel.group || 'En Vivo';

            tvLoadingSpinner.classList.remove('hidden');
            tvPlayerModal.classList.remove('hidden');

            const streamUrl = channel.url;

            if (tvHls) {
                tvHls.destroy();
                tvHls = null;
            }

            const isHls = streamUrl.toLowerCase().includes('.m3u8') || streamUrl.includes('tracks-v1a1');

            if (isHls && Hls.isSupported()) {
                tvHls = new Hls({ enableWorker: true, lowLatencyMode: true });
                tvHls.loadSource(streamUrl);
                tvHls.attachMedia(tvVideo);
                tvHls.on(Hls.Events.MANIFEST_PARSED, () => {
                    tvVideo.play().catch(() => {});
                });
                tvHls.on(Hls.Events.ERROR, (e, data) => {
                    if (data.fatal) {
                        showStatus('Error al cargar la señal de TV.', 'error');
                        tvLoadingSpinner.classList.add('hidden');
                    }
                });
            } else {
                tvVideo.src = streamUrl;
                tvVideo.play().catch(() => {});
            }

            handleTitle.textContent = channel.title;
            renderCurrentContent();
        }

        function stopTv() {
            if (tvHls) {
                tvHls.destroy();
                tvHls = null;
            }
            tvVideo.pause();
            tvVideo.removeAttribute('src');
            tvVideo.load();
        }

        function startAudioPlayback() {
            audio.play().then(() => {
                reconnectAttempts = 0;
                setIsPlaying(true);
                setLoadingState(false);
            }).catch(() => setLoadingState(false));
        }

        function stopAndCleanupAudio() {
            if (radioHls) {
                radioHls.destroy();
                radioHls = null;
            }
            audio.pause();
            audio.removeAttribute('src');
            audio.load();
        }

        function handleAudioError() {
            if (currentRadioItem && reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
                reconnectAttempts++;
                showStatus(`Reconectando (${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS})...`, 'warning');
                setTimeout(() => {
                    if (currentRadioItem) playRadio(currentRadioItem);
                }, 2000);
            } else {
                showStatus('Error al reproducir emisora.', 'error');
                setLoadingState(false);
                setIsPlaying(false);
                reconnectAttempts = 0;
            }

                navigator.mediaSession.setActionHandler('pause', () => {

            handleTitle = document.getElementById('handleTitle');
            visualizerBars = document.getElementById('visualizerBars');

            loadAllData();
            updateFavoritesBadge();

            volumeSlider.addEventListener('input', (e) => {
                audio.volume = parseFloat(e.target.value);
                audio.muted = false;
                updateVolumeIcon(audio.volume);
                keepControlsAlive();
            });

            modalSearchInput.addEventListener('input', (e) => {
                renderModalSearchResults(e.target.value.trim().toLowerCase());
            });

            audio.addEventListener('error', () => handleAudioError());

            audio.addEventListener('playing', () => {
                reconnectAttempts = 0;
                setLoadingState(false);
                setIsPlaying(true);
            });

            audio.addEventListener('waiting', () => setLoadingState(true));

            tvVideo.addEventListener('waiting', () => tvLoadingSpinner.classList.remove('hidden'));
            tvVideo.addEventListener('playing', () => {
                tvLoadingSpinner.classList.add('hidden');
                visualizerBars.classList.add('visualizer-active');
            });
            tvVideo.addEventListener('pause', () => {
                visualizerBars.classList.remove('visualizer-active');
            });

            topHeader.addEventListener('pointerdown', () => keepControlsAlive());
            bottomPlayer.addEventListener('pointerdown', () => keepControlsAlive());

            setupMediaSessionHandlers();
        });
    </script>
</body>
</html>
